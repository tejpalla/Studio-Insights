services:
  - type: web
    name: helix-story-intelligence
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-pro
      - key: OPENAI_ARENA_MODEL
        value: gpt-5.4-pro
      - key: OPENAI_REASONING_EFFORT
        value: xhigh
      - key: OPENAI_ARENA_REASONING_EFFORT
        value: high
      - key: ARENA_ISOLATION
        value: inline
      - key: ARENA_USE_WORKERS
        value: "1"
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_CATALOG
        value: workspace
      - key: DATABRICKS_SCHEMA
        value: default
      - key: DATABRICKS_VOLUME
        value: helix_arena
